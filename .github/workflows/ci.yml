name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-mock-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-mock-domain
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-mock-project
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-mock-appid
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-mock-bucket
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-mock-sender
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_key
          RAZORPAY_KEY_SECRET: ci_secret_key

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
